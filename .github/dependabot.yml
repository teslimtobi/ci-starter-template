# Dependabot checks for outdated or vulnerable dependencies and opens pull requests.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Africa/Lagos"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      # One pull request for all minor and patch updates, to keep review light.
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Africa/Lagos"
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns: ["*"]
